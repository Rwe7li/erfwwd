<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Iframe View</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #111;
  font-family: Arial, sans-serif;
  height: 100vh;
}

/* GRID LAYOUT */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 10px;
  padding: 10px;
  height: 100%;
}

/* EACH BOX */
.frame-box {
  background: #000;
  border: 2px solid #333;
  border-radius: 10px;
  overflow: hidden;
}

/* IFRAME */
iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* MOBILE RESPONSIVE */
@media (max-width: 768px) {
  .container {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="frame-box">
    <iframe src="https://tme-join.github.io/suCqjSG9H/" loading="lazy"></iframe>
  </div>

  <div class="frame-box">
    <iframe src="https://tme-join.github.io/suCqjSG9H/" loading="lazy"></iframe>
  </div>

  <div class="frame-box">
    <iframe src="https://tme-join.github.io/suCqjSG9H/" loading="lazy"></iframe>
  </div>

  <div class="frame-box">
    <iframe src="https://tme-join.github.io/suCqjSG9H/" loading="lazy"></iframe>
  </div>

</div>

</body>
</html>
